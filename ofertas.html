<head>
  <meta charset="UTF-8" />

  <meta property="og:title" content="Ofertas — Henrique Corilaço" />
  <meta property="og:description" content="Ofertas selecionadas com links de afiliado do Mercado Livre. Produtos de outdoor, tecnologia e mais." />
  <meta property="og:image" content="https://rickcorilaco.github.io/rickcorilaco/imagens/chumbinho-hero.jpg" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ofertas — Henrique Corilaço" />
  <meta name="twitter:description" content="Ofertas selecionadas com links de afiliado do Mercado Livre." />
  <meta name="twitter:image" content="https://rickcorilaco.github.io/rickcorilaco/imagens/chumbinho-hero.jpg" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #f0c040;
      --card-bg: #1a1a1a;
      --border: #2a2a2a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 4rem;
      background: rgba(13,13,13,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      animation: fadeDown 0.6s ease both;
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--text);
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--accent); }

    .banner-wrapper {
      margin-top: 80px;
      width: 100%;
      max-height: 280px;
      overflow: hidden;
      background: #111;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-placeholder {
      width: 100%;
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #111 100%);
      border: 2px dashed var(--border);
      gap: 0.75rem;
      color: var(--muted);
    }

    .banner-placeholder span:first-child { font-size: 2.5rem; }
    .banner-placeholder p { font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .banner-wrapper img { width: 100%; height: 280px; object-fit: cover; display: block; }

    .page-header { padding: 3rem 4rem 1.5rem; animation: fadeUp 0.6s 0.1s ease both; }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .page-header h1 em { font-style: italic; color: var(--accent); }
    .page-header p { font-size: 0.9rem; color: var(--muted); }

    .offers-section { padding: 2rem 4rem 6rem; animation: fadeUp 0.6s 0.2s ease both; }

    .offers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    .offer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .offer-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 40px rgba(240,192,64,0.08);
    }

    .offer-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      overflow: hidden;
    }

    .offer-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 0.75rem;
    }

    .offer-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .offer-name {
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.45;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .offer-price {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: auto;
    }

    .offer-price-old {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: line-through;
    }

    .offer-badge {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      width: fit-content;
    }

    /* Loading state */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer p { font-size: 0.8rem; color: var(--muted); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1100px) { .offers-grid { grid-template-columns: repeat(3, 1fr); } }

    @media (max-width: 768px) {
      nav { padding: 1.2rem 1.5rem; }
      .page-header { padding: 2rem 1.5rem 1rem; }
      .offers-section { padding: 1.5rem 1.5rem 4rem; }
      .offers-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; padding: 2rem 1.5rem; }
    }

    @media (max-width: 480px) { .offers-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; } }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Henrique Corilaço</a>
    <ul class="nav-links">
      <li><a href="index.html#artigos">Artigos</a></li>
      <li><a href="ofertas.html" class="active">Ofertas</a></li>
      <li><a href="index.html#redes">Redes Sociais</a></li>
    </ul>
  </nav>

  <div class="banner-wrapper">
    <div class="banner-placeholder">
      <span>🏷️</span>
      <p>Espaço para banner publicitário · 1200 × 280 px</p>
    </div>
  </div>

  <div class="page-header">
    <h1>Melhores <em>ofertas</em></h1>
    <p>Selecionei os melhores produtos com links de afiliado. Aproveite!</p>
  </div>

  <section class="offers-section">
    <div class="offers-grid" id="offersGrid">
      <div class="loading">Carregando ofertas...</div>
    </div>
  </section>

  <footer>
    <a href="index.html" class="nav-logo">Henrique Corilaço</a>
    <p>© 2026 · Links de afiliado Mercado Livre</p>
  </footer>

  <script>
    function formatBRL(value) {
      return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderCard(oferta) {
      const imgHTML = oferta.imagem_thumb
        ? `<img src="${oferta.imagem_thumb}" alt="${oferta.nome}" />`
        : `<span>${oferta.emoji || '🛒'}</span>`;

      return `
        <a href="oferta.html?id=${oferta.uuid}" class="offer-card">
          <div class="offer-img-wrap">${imgHTML}</div>
          <div class="offer-body">
            <span class="offer-badge">${oferta.badge}</span>
            <p class="offer-name">${oferta.nome}</p>
            <span class="offer-price-old">${formatBRL(oferta.preco_de)}</span>
            <span class="offer-price">${formatBRL(oferta.preco_por)}</span>
          </div>
        </a>`;
    }

    async function loadOfertas() {
      const grid = document.getElementById('offersGrid');
      try {
        const res = await fetch('ofertas.json');
        if (!res.ok) throw new Error('Erro ao carregar JSON');
        const data = await res.json();
        grid.innerHTML = data.ofertas.map(renderCard).join('');
      } catch (err) {
        grid.innerHTML = `<div class="loading">Não foi possível carregar as ofertas.</div>`;
        console.error(err);
      }
    }

    loadOfertas();
  </script>

</body>
</html>
