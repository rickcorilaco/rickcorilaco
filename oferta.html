<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oferta — Henrique Corilaço</title>
  <meta name="description" content="Oferta selecionada por Henrique Corilaço com link de afiliado do Mercado Livre." />
  <meta name="author" content="Henrique Corilaço" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="product" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="twitter:card" content="summary_large_image" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #f0c040;
      --card-bg: #1a1a1a;
      --border: #2a2a2a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 4rem;
      background: rgba(13,13,13,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--text);
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--accent); }

    .breadcrumb-bar {
      margin-top: 80px;
      padding: 1rem 4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .breadcrumb-bar a {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 500;
    }

    .breadcrumb-bar a:hover { text-decoration: underline; }
    .breadcrumb-bar span { font-size: 0.8rem; color: var(--muted); }

    .product-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: start;
      animation: fadeUp 0.7s 0.1s ease both;
    }

    .product-gallery { position: sticky; top: 100px; }

    .product-main-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8rem;
    }

    .product-main-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 2rem;
    }

    .product-info { display: flex; flex-direction: column; gap: 1.5rem; }

    .product-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 2px;
    }

    .badge-hot { background: var(--accent); color: #000; }
    .badge-cat { background: #2a2a2a; color: var(--muted); border: 1px solid var(--border); }

    .product-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      line-height: 1.3;
      font-weight: 700;
    }

    .product-price-block {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .price-old { font-size: 0.9rem; color: var(--muted); text-decoration: line-through; }

    .price-current {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .price-discount { font-size: 0.8rem; color: #4caf82; font-weight: 500; }

    .price-warning {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      font-style: italic;
      line-height: 1.5;
    }

    .price-warning span { font-size: 1rem; flex-shrink: 0; }

    .btn-affiliate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--accent);
      color: #000;
      padding: 1rem 2rem;
      border-radius: 3px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(240,192,64,0.25);
    }

    .btn-affiliate:hover {
      background: #ffd84d;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(240,192,64,0.35);
    }

    .coupon-block { display: flex; flex-direction: column; gap: 0.5rem; }

    .coupon-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .btn-coupon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border: 1.5px dashed var(--accent);
      color: var(--accent);
      padding: 0.85rem 1.2rem;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      width: 100%;
    }

    .btn-coupon:hover { background: rgba(240,192,64,0.08); }

    .btn-coupon .copy-hint {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .btn-coupon.copied { background: rgba(76,175,130,0.12); border-color: #4caf82; color: #4caf82; }

    .coupon-copied-msg {
      font-size: 0.78rem;
      color: #4caf82;
      height: 1rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .coupon-copied-msg.visible { opacity: 1; }

    .product-details {
      padding: 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .product-details h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .spec-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }

    .spec-item:last-child { border-bottom: none; }
    .spec-key { color: var(--muted); }
    .spec-val { font-weight: 500; color: var(--text); text-align: right; }

    .back-bar { max-width: 1100px; margin: 0 auto; padding: 0 2rem 4rem; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .back-link:hover { border-color: var(--accent); transform: translateY(-1px); }

    /* Loading / Error */
    .status-msg {
      max-width: 1100px;
      margin: 8rem auto 4rem;
      padding: 0 2rem;
      text-align: center;
      color: var(--muted);
    }

    .status-msg h2 { font-family: 'Playfair Display', serif; color: var(--text); margin-bottom: 1rem; }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer p { font-size: 0.8rem; color: var(--muted); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 860px) {
      nav { padding: 1.2rem 1.5rem; }
      .breadcrumb-bar { padding: 1rem 1.5rem; }
      .product-wrapper { grid-template-columns: 1fr; gap: 2.5rem; padding: 2rem 1.5rem 4rem; }
      .product-gallery { position: static; }
      .back-bar { padding: 0 1.5rem 3rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Henrique Corilaço</a>
    <ul class="nav-links">
      <li><a href="index.html#artigos">Artigos</a></li>
      <li><a href="ofertas.html" class="active">Ofertas</a></li>
      <li><a href="index.html#redes">Redes Sociais</a></li>
    </ul>
  </nav>

  <div class="breadcrumb-bar">
    <a href="index.html">Início</a>
    <span>›</span>
    <a href="ofertas.html">Ofertas</a>
    <span>›</span>
    <span id="breadcrumbNome">Carregando...</span>
  </div>

  <div id="appContent"></div>

  <footer>
    <a href="index.html" class="nav-logo">Henrique Corilaço</a>
    <p>© 2026 · Links de afiliado Mercado Livre</p>
  </footer>

  <script>
    function formatBRL(value) {
      return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function economiaValor(de, por) {
      return formatBRL(de - por);
    }

    function renderProduct(o) {
      const imgHTML = o.imagem_hero
        ? `<img src="${o.imagem_hero}" alt="${o.nome}" />`
        : `<span>${o.emoji || '🛒'}</span>`;

      const categoriasHTML = (o.categorias || [])
        .map(c => `<span class="badge badge-cat">${c}</span>`)
        .join('');

      const specsHTML = (o.especificacoes || [])
        .map(s => `<div class="spec-item"><span class="spec-key">${s.chave}</span><span class="spec-val">${s.valor}</span></div>`)
        .join('');

      const cupomHTML = o.cupom ? `
        <div class="coupon-block">
          <span class="coupon-label">🏷️ Cupom de desconto</span>
          <button class="btn-coupon" id="couponBtn" onclick="copyCoupon('${o.cupom}')">
            <span id="couponCode">${o.cupom}</span>
            <span class="copy-hint" id="copyHint">Clique para copiar</span>
          </button>
          <span class="coupon-copied-msg" id="copiedMsg">✅ Cupom copiado! Cole no Mercado Livre.</span>
        </div>` : '';

      return `
        <div class="product-wrapper">
          <div class="product-gallery">
            <div class="product-main-img">${imgHTML}</div>
          </div>
          <div class="product-info">
            <div class="product-badges">
              <span class="badge badge-hot">${o.badge}</span>
              ${categoriasHTML}
            </div>
            <h1 class="product-name">${o.nome}</h1>
            <div class="product-price-block">
              <span class="price-old">De ${formatBRL(o.preco_de)}</span>
              <span class="price-current">${formatBRL(o.preco_por)}</span>
              <span class="price-discount">↓ Você economiza ${economiaValor(o.preco_de, o.preco_por)} (${o.desconto_pct}% OFF)</span>
              <p class="price-warning">
                <span>⚠️</span>
                O valor pode mudar a qualquer momento. Confira o preço final antes de finalizar a compra.
              </p>
            </div>
            <a href="${o.link_afiliado}" target="_blank" rel="noopener sponsored" class="btn-affiliate">
              🛒 Ver oferta no Mercado Livre
            </a>
            ${cupomHTML}
            <div class="product-details">
              <h3>Especificações</h3>
              ${specsHTML}
            </div>
          </div>
        </div>
        <div class="back-bar">
          <a href="ofertas.html" class="back-link">← Voltar para ofertas</a>
        </div>`;
    }

    function copyCoupon(code) {
      const btn = document.getElementById('couponBtn');
      const hint = document.getElementById('copyHint');
      const msg = document.getElementById('copiedMsg');

      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add('copied');
        hint.textContent = '✅ Copiado!';
        msg.classList.add('visible');
        setTimeout(() => {
          btn.classList.remove('copied');
          hint.textContent = 'Clique para copiar';
          msg.classList.remove('visible');
        }, 3000);
      });
    }

    async function loadOferta() {
      const app = document.getElementById('appContent');
      const params = new URLSearchParams(window.location.search);
      const uuid = params.get('id');

      if (!uuid) {
        app.innerHTML = `<div class="status-msg"><h2>Oferta não encontrada</h2><p>Nenhum ID fornecido. <a href="ofertas.html" style="color:var(--accent)">Ver todas as ofertas</a>.</p></div>`;
        return;
      }

      try {
        const res = await fetch('ofertas.json');
        if (!res.ok) throw new Error('Erro ao carregar JSON');
        const data = await res.json();

        const oferta = data.ofertas.find(o => o.uuid === uuid);

        if (!oferta) {
          app.innerHTML = `<div class="status-msg"><h2>Oferta não encontrada</h2><p>O produto com este ID não existe. <a href="ofertas.html" style="color:var(--accent)">Ver todas as ofertas</a>.</p></div>`;
          return;
        }

        document.title = `${oferta.nome} — Henrique Corilaço`;
        document.getElementById('breadcrumbNome').textContent = oferta.nome.length > 50 ? oferta.nome.substring(0, 50) + '...' : oferta.nome;

        // SEO dinâmico
        const baseUrl = 'https://rickcorilaco.github.io/rickcorilaco';
        const pageUrl = `${baseUrl}/oferta.html?id=${oferta.uuid}`;
        const imgUrl = oferta.imagem_hero ? `${baseUrl}/${oferta.imagem_hero}` : '';
        const desc = `${oferta.nome} por R$ ${oferta.preco_por.toFixed(2).replace('.', ',')} — Oferta com link de afiliado do Mercado Livre.`;

        document.querySelector('meta[name="description"]').setAttribute('content', desc);
        document.querySelector('meta[property="og:type"]').setAttribute('content', 'product');

        const setOrCreate = (sel, attr, val) => {
          let el = document.querySelector(sel);
          if (!el) { el = document.createElement('meta'); document.head.appendChild(el); }
          el.setAttribute(attr, val);
        };

        setOrCreate('meta[property="og:url"]',         'content', pageUrl);
        setOrCreate('meta[property="og:title"]',       'content', `${oferta.nome} — Henrique Corilaço`);
        setOrCreate('meta[property="og:description"]', 'content', desc);
        setOrCreate('meta[property="og:image"]',       'content', imgUrl);
        setOrCreate('link[rel="canonical"]',           'href',    pageUrl);
        setOrCreate('meta[name="twitter:title"]',      'content', `${oferta.nome} — Henrique Corilaço`);
        setOrCreate('meta[name="twitter:description"]','content', desc);
        setOrCreate('meta[name="twitter:image"]',      'content', imgUrl);
        app.innerHTML = renderProduct(oferta);

      } catch (err) {
        app.innerHTML = `<div class="status-msg"><h2>Erro ao carregar</h2><p>Não foi possível carregar a oferta. Tente novamente.</p></div>`;
        console.error(err);
      }
    }

    loadOferta();
  </script>

</body>
</html>
